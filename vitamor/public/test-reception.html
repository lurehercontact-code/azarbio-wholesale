<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitamor — Test réception directe</title>
<style>body{font:16px Arial;margin:30px auto;max-width:600px;padding:16px;background:#fffdf8;color:#173f2c}label{display:block;margin:14px 0 5px}input,select,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd5cf;border-radius:8px;font:inherit}button{margin-top:18px;background:#0b5837;color:white;cursor:pointer}pre{white-space:pre-wrap;background:#eef4ee;padding:16px;border-radius:8px}</style>
<h1>Test réception directe</h1><p>Contacts fictifs uniquement. Aucun événement publicitaire, aucune expédition, aucun transfert au CRM.</p>
<form id="test"><label>Mode</label><select name="mode"><option value="abandoned">Panier abandonné</option><option value="order">Commande complète</option></select><label>Téléphone fictif</label><select name="phone"><option>0600000000</option><option>0700000000</option></select><label>Nom</label><input name="name" value="TEST Vitamor"><label>Ville</label><input name="city" value="Casablanca"><label>Adresse</label><input name="address" value="Adresse fictive"><label>Offre</label><select name="offer_package"><option value="500G">500 g — 199 DH</option><option value="1KG" selected>1 kg — 299 DH</option><option value="2KG_PLUS_500G">2,5 kg — 499 DH</option></select><button>Envoyer le test</button></form><button id="new">Nouvel identifiant de commande</button><pre id="result">Test HTTP non effectué. Le récepteur Google doit être configuré.</pre>
<script>let eventId='test-'+crypto.randomUUID();document.getElementById('new').onclick=()=>{eventId='test-'+crypto.randomUUID();document.getElementById('result').textContent='Nouvel identifiant : '+eventId};document.getElementById('test').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const data=Object.fromEntries(new FormData(e.target));data.event_id=eventId;data.updated_at=Date.now();const r=await fetch('/api/direct-test-lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});document.getElementById('result').textContent=JSON.stringify(await r.json(),null,2)}catch{document.getElementById('result').textContent='Erreur de connexion. Enregistrement non confirmé.'}finally{button.disabled=false}};</script></html>
