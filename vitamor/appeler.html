<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>الاتصال بالزبون — Vitamor</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f8f2;font:18px/1.7 system-ui;color:#173f2c}main{width:min(90%,420px);text-align:center;background:white;padding:28px 16px;border-radius:20px}a,button{display:block;padding:16px;margin:12px 0;border-radius:12px;font:700 20px system-ui;text-decoration:none;border:0}a{background:#0b5837;color:white}button{width:100%;background:#edf4ed;color:#173f2c}#number{direction:ltr;font-size:28px;font-weight:700}small{font-size:14px;color:#637067}</style></head><body><main><h1>الاتصال بالزبون</h1><p id="number"></p><a id="call" hidden>📞 اتصل دابا</a><button id="copy" hidden>نسخ الرقم</button><p id="message" role="status"></p><small>من بعد الاتصال، رجع للشيت وكمل معلومات الزبون.</small></main><script>
const phone=location.hash.slice(1);const valid=/^0[567]\d{8}$/.test(phone);const number=document.getElementById('number'),call=document.getElementById('call'),copy=document.getElementById('copy'),message=document.getElementById('message');
if(valid){number.textContent=phone;call.hidden=false;call.href='tel:+212'+phone.slice(1);copy.hidden=false;copy.onclick=async()=>{try{await navigator.clipboard.writeText(phone);message.textContent='تم نسخ الرقم';}catch{message.textContent='اضغط مطولاً على الرقم لنسخه';}};}else{message.textContent='رقم الهاتف غير صحيح. رجع للشيت وتأكد من الرقم.';}
</script></body></html>
