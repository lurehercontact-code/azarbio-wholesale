name: ThannaTech Android APK

on:
  push:
    branches:
      - thannatech-android-build
    paths:
      - 'thannatech-android/**'
      - '.github/workflows/thannatech-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout isolated Android branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform using runner SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack app source
        run: |
          mkdir -p android-project
          base64 -d thannatech-android/source.b64 > /tmp/thannatech-project.zip
          unzip -q /tmp/thannatech-project.zip -d android-project
          test -f android-project/app/src/main/java/ma/vitamor/thannatech/MainActivity.java

      - name: Create release signing key
        shell: bash
        run: |
          set -euo pipefail
          PASS=$(openssl rand -hex 24)
          printf '%s' "$PASS" > "$RUNNER_TEMP/signing-pass.txt"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/thannatech-signing.jks" \
            -alias "thannatech" -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=ThannaTech,O=Qarmacha,C=MA" \
            -storepass "$PASS" -keypass "$PASS"
          echo "THANNATECH_KEYSTORE=$RUNNER_TEMP/thannatech-signing.jks" >> "$GITHUB_ENV"
          echo "THANNATECH_SIGNING_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Configure Gradle release signing
        shell: bash
        run: |
          cat >> android-project/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  thannatech {
                      storeFile file(System.getenv('THANNATECH_KEYSTORE'))
                      storePassword System.getenv('THANNATECH_SIGNING_PASS')
                      keyAlias 'thannatech'
                      keyPassword System.getenv('THANNATECH_SIGNING_PASS')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.thannatech
                  }
              }
          }
          GRADLE

      - name: Build signed APK
        working-directory: android-project
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-project/app/build/outputs/apk/release/app-release.apk

      - name: Encrypt signing key backup for owner's PC
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs'), crypto = require('crypto'), path = require('path');
          const root = process.env.RUNNER_TEMP;
          const secret = Buffer.from(JSON.stringify({
            alias: 'thannatech',
            password: fs.readFileSync(path.join(root,'signing-pass.txt'),'utf8'),
            keystore: fs.readFileSync(path.join(root,'thannatech-signing.jks')).toString('base64')
          }));
          const publicKey = fs.readFileSync('thannatech-android/signing-public-key.pem');
          const key = crypto.randomBytes(32);
          const iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm',key,iv);
          const encrypted = Buffer.concat([cipher.update(secret),cipher.final()]);
          const wrappedKey = crypto.publicEncrypt({
            key: publicKey,
            padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
            oaepHash: 'sha256'
          },key);
          fs.writeFileSync('android-project/signing-backup.encrypted.json',JSON.stringify({
            version: 1,
            algorithm: 'AES-256-GCM + RSA-OAEP-SHA256',
            wrappedKey: wrappedKey.toString('base64'),
            iv: iv.toString('base64'),
            tag: cipher.getAuthTag().toString('base64'),
            data: encrypted.toString('base64')
          },null,2));
          NODE

      - name: Upload APK and encrypted signing backup
        uses: actions/upload-artifact@v4
        with:
          name: ThannaTech-Android-APK-v1
          path: |
            android-project/app/build/outputs/apk/release/app-release.apk
            android-project/signing-backup.encrypted.json
          if-no-files-found: error
          retention-days: 90
