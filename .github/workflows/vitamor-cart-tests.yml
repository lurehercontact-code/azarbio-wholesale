name: Vitamor direct reception checks
on:
  push:
    branches: [codex/vitamor-direct-production, codex/vitamor-consumer-project]
  pull_request:
    paths:
      - 'vitamor/**'
      - '.github/workflows/vitamor-cart-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify direct CRM capture, acknowledgement and legacy receiver
        run: node --test vitamor/tests/*.test.mjs
